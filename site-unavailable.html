<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Site unavailable</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #050505;
      color: #f5f5f5;
      font-family: Arial, Helvetica, sans-serif;
    }
    main {
      width: min(560px, calc(100% - 40px));
      padding: 48px 24px;
      text-align: center;
    }
    h1 { margin: 0 0 16px; font-size: clamp(2rem, 7vw, 4rem); }
    p { margin: 0; color: #bdbdbd; font-size: 1.05rem; line-height: 1.6; }
  </style>
</head>
<body>
  <main>
    <h1>Site unavailable</h1>
    <p>This website is no longer available.</p>
  </main>
</body>
</html>
